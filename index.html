<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italian Charm Bracelet Generator</title>
  <style>
    :root {
      --baby-pink: #fbc4d0;       /* Pastel baby pink */
      --soft-pink-bg: #fff0f3;    /* Light ambient background tint */
      --metal-base: #d2d2d4;      /* Stainless steel flat grey */
      --charcoal-panel: #222226;  /* Minimalist dark workspace elements */
      --text-light: #f5f5f7;
      --text-muted: #9e9e9e;
      --border-metallic: #828285;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--baby-pink);
      padding: 25px;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Main Workspace Container */
    .app-canvas {
      flex: 1;
      border: 2px solid rgba(0, 0, 0, 0.05);
      background-color: var(--soft-pink-bg);
      position: relative;
      display: flex;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
    }

    /* Left Control Tray (Text Erased, Minimal Layout) */
    .control-deck {
      width: 320px;
      background-color: var(--charcoal-panel);
      margin: 25px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }

    /* Action Buttons (Clean, Emoji-Free Typography) */
    .upload-action-btn {
      display: block;
      background: linear-gradient(135deg, #ff758f 0%, #ff8fa3 100%);
      color: white;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 117, 143, 0.2);
      transition: transform 0.1s, opacity 0.2s;
    }
    .upload-action-btn:hover { opacity: 0.95; }
    .upload-action-btn:active { transform: scale(0.98); }
    #image-uploader { display: none; }

    .reset-action-btn {
      background-color: #3a3a42;
      color: #ff758f;
      border: 1px solid #4e4e5a;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
      margin-top: auto;
    }
    .reset-action-btn:hover { background-color: #44444e; }

    /* Inventory Storage Matrix Grid */
    .inventory-vault {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background-color: #18181c;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #2d2d34;
      flex: 1;
      overflow-y: auto;
    }

    /* METALLIC LINK DESIGN CORE STRUCTURE */
    .italian-charm-link {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #f0f0f2 0%, #d2d2d4 45%, #b5b5b7 55%, #9d9da0 100%);
      border: 1px solid var(--border-metallic);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 1px 1px 0px rgba(255, 255, 255, 0.8),
        inset -1px -1px 0px rgba(0, 0, 0, 0.2),
        0 4px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .inventory-vault .italian-charm-link:hover {
      transform: scale(1.08) translateY(-2px);
      z-index: 5;
    }

    /* Internal Frame Inner Rim Lining */
    .italian-charm-link::before {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 2px solid #919194;
      border-radius: 2px;
      background-color: #e3e3e5;
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    /* Interlocking Connection Edge Link Side Hooks */
    .italian-charm-link::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 28px;
      background: linear-gradient(#b5b5b7, #666);
      right: -4px;
      top: 15px;
      border-radius: 0 2px 2px 0;
      border: 1px solid #555;
      border-left: none;
      z-index: 0;
    }

    .artwork-envelope {
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      border-radius: 1px;
      overflow: hidden;
    }

    /* Glossy dome reflection coat layer */
    .gloss-reflection-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 50%);
      z-index: 3;
      pointer-events: none;
    }

    /* Main Display Lounge */
    .display-lounge {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    /* Main Bracelet Presentation Base Display Box */
    .bracelet-assembly-deck {
      width: 100%;
      max-width: 780px;
      height: 180px;
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 30px;
    }

    .chain-rail-track {
      display: flex;
      align-items: center;
      gap: 0px; /* Forces flat continuous layout sequence matching */
      overflow-x: auto;
      width: 100%;
      padding: 15px 0;
    }
    .chain-rail-track::-webkit-scrollbar { display: none; }

    .chain-rail-track .italian-charm-link {
      width: 70px;  /* Slightly upscaled on presentation rail */
      height: 70px;
      flex-shrink: 0;
      animation: charmJoinTrack 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.15);
    }
    .chain-rail-track .italian-charm-link::before {
      top: 7px; left: 7px; right: 7px; bottom: 7px;
    }
    .chain-rail-track .italian-charm-link::after {
      width: 4px;
      height: 32px;
      right: -4px;
      top: 18px;
    }
    .chain-rail-track .italian-charm-link:last-child::after {
      display: none; /* Hide loose dangling clip at end of layout line */
    }

    @keyframes charmJoinTrack {
      0% { transform: scale(0.6) translateX(-20px); opacity: 0; }
      100% { transform: scale(1) translateX(0); opacity: 1; }
    }

    .instruction-ticker-tag {
      margin-top: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #a48b8e;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="app-canvas">
    
    <div class="control-deck">
      <label for="image-uploader" class="upload-action-btn">
        Upload Image
      </label>
      <input type="file" id="image-uploader" accept="image/png, image/jpeg">

      <div class="inventory-vault" id="vault-target">
        </div>

      <button class="reset-action-btn" id="purge-rail-btn">Clear Bracelet</button>
    </div>

    <div class="display-lounge">
      <div class="bracelet-assembly-deck">
        <div class="chain-rail-track" id="active-rail-track">
          </div>
      </div>

      <div class="instruction-ticker-tag">
        Click a charm to add to bracelet • Click an active charm to remove
      </div>
    </div>

  </div>

  <script>
    const vaultTarget = document.getElementById('vault-target');
    const activeRailTrack = document.getElementById('active-rail-track');
    const imageUploader = document.getElementById('image-uploader');
    const purgeRailBtn = document.getElementById('purge-rail-btn');

    // Baseline Asset Database Arrays Configuration 
    let charmVaultMemory = [
      { id: 'classic_heart', type: 'svg', content: `<svg viewBox="0 0 24 24" fill="#ff4d6d" width="34" height="34"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>` },
      { id: 'classic_star', type: 'svg', content: `<svg viewBox="0 0 24 24" fill="#ffd166" width="34" height="34"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>` },
      { id: 'classic_yin', type: 'svg', content: `<svg viewBox="0 0 24 24" fill="#222" width="32" height="32"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-13c-1.38 0-2.5 1.12-2.5 2.5S10.62 10 12 10s2.5-1.12 2.5-2.5S13.38 7 12 7zm0 6c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z" fill="#fff"/><path d="M12 4c-4.41 0-8 3.59-8 8s3.59 8 8 8V4z"/></svg>` },
      { id: 'classic_daisy', type: 'svg', content: `<svg viewBox="0 0 24 24" width="34" height="34"><circle cx="12" cy="12" r="3" fill="#ffd166"/><path d="M12 2a2 2 0 00-2 2v2a2 2 0 004 0V4a2 2 0 00-2-2zm0 14a2 2 0 00-2 2v2a2 2 0 004 0v-2a2 2 0 00-2-2zM4 10a2 2 0 00-2 22 2 0 004 0v-2a2 2 0 00-2-2zm14 2a2 2 0 00-2 2v2a2 2 0 004 0v-2a2 2 0 00-2-2z" fill="#a48b8e" opacity="0.85"/></svg>` },
      { id: 'classic_initial', type: 'svg', content: `<svg viewBox="0 0 24 24" width="32" height="32"><text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#06d6a0">M</text></svg>` }
    ];

    let activeBraceletChain = [];

    window.onload = () => {
      generateInventoryVaultGrid();
      // Instantiation starter load profile tracking configurations
      activeBraceletChain = [charmVaultMemory[0], charmVaultMemory[1], charmVaultMemory[3]];
      buildActiveBraceletRail();
    };

    // Render Storage Inventory Selector Matrix
    function generateInventoryVaultGrid() {
      vaultTarget.innerHTML = "";
      charmVaultMemory.forEach(charm => {
        const link = document.createElement('div');
        link.classList.add('italian-charm-link');

        const env = document.createElement('div');
        env.classList.add('artwork-envelope');

        if (charm.type === 'svg') {
          env.innerHTML = charm.content;
        } else if (charm.type === 'upload') {
          env.style.backgroundImage = `url('${charm.content}')`;
          const gloss = document.createElement('div');
          gloss.classList.add('gloss-reflection-layer');
          env.appendChild(gloss);
        }

        link.appendChild(env);
        link.addEventListener('click', () => appendCharmToRailTrack(charm));
        vaultTarget.appendChild(link);
      });
    }

    // Render Interactive Horizontal Linked Chain Band
    function buildActiveBraceletRail() {
      activeRailTrack.innerHTML = "";
      activeBraceletChain.forEach((charm, positionIdx) => {
        const link = document.createElement('div');
        link.classList.add('italian-charm-link');

        const env = document.createElement('div');
        env.classList.add('artwork-envelope');

        if (charm.type === 'svg') {
          env.innerHTML = charm.content;
        } else if (charm.type === 'upload') {
          env.style.backgroundImage = `url('${charm.content}')`;
          const gloss = document.createElement('div');
          gloss.classList.add('gloss-reflection-layer');
          env.appendChild(gloss);
        }

        link.appendChild(env);
        link.addEventListener('click', () => discardCharmFromRailTrack(positionIdx));
        activeRailTrack.appendChild(link);
      });
    }

    function appendCharmToRailTrack(charmPayload) {
      if (activeBraceletChain.length >= 12) {
        alert("The bracelet band is full. Click an active charm to remove it.");
        return;
      }
      activeBraceletChain.push(charmPayload);
      buildActiveBraceletRail();
    }

    function discardCharmFromRailTrack(targetIdx) {
      activeBraceletChain.splice(targetIdx, 1);
      buildActiveBraceletRail();
    }

    // Binary File Stream Pipeline Reader
    imageUploader.addEventListener('change', function(e) {
      const fileTarget = e.target.files[0];
      if (!fileTarget) return;

      const streamReader = new FileReader();
      streamReader.onload = function(event) {
        const compiledDataUrl = event.target.result;
        
        // Prepend freshly loaded element payload node back to storage array
        charmVaultMemory.unshift({
          id: `custom_charm_link_${Date.now()}`,
          type: 'upload',
          content: compiledDataUrl
        });

        // Refresh views
        generateInventoryVaultGrid();
        appendCharmToRailTrack(charmVaultMemory[0]);
      };
      streamReader.readAsDataURL(fileTarget);
    });

    purgeRailBtn.addEventListener('click', () => {
      activeBraceletChain = [];
      buildActiveBraceletRail();
    });
  </script>
</body>
</html>
