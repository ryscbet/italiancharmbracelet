<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximalist Italian Charm Studio</title>
  <style>
    :root {
      --frame-yellow: #fcd116;    /* Bright yellow border from designinspo.jpg */
      --sky-blue: #5da9e9;
      --hill-green: #7cb518;
      --ink-black: #000000;
      --paper-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', Times, serif;
      user-select: none;
    }

    /* Page container simulating the outer yellow frame of designinspo.jpg */
    body {
      background-color: var(--frame-yellow);
      padding: 25px;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Main workspace wrapper containing the surreal background collage */
    .app-canvas {
      flex: 1;
      border: 4px solid var(--ink-black);
      background: linear-gradient(to bottom, var(--sky-blue) 0%, #bde0fe 50%, var(--hill-green) 55%, #4f772d 100%);
      position: relative;
      display: flex;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    /* CSS Cloud/Surreal Elements Background Art Layers */
    .app-canvas::before {
      content: '☁️';
      position: absolute;
      top: 10%; left: 40%; font-size: 5rem; opacity: 0.35;
    }
    .app-canvas::after {
      content: '☁️';
      position: absolute;
      top: 25%; left: 80%; font-size: 7rem; opacity: 0.25;
    }

    /* Heavy Ink Zine-Style Panels */
    .zine-box {
      background-color: var(--paper-white);
      border: 3px solid var(--ink-black);
      box-shadow: 7px 7px 0px var(--ink-black);
      border-radius: 2px;
      padding: 20px;
    }

    /* Left Control panel styled like a print flyer cut-out */
    .control-deck {
      width: 350px;
      margin: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 5;
      position: relative;
    }

    .control-deck h2 {
      font-family: 'Arial Black', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: -1px;
      border-bottom: 3px dashed var(--ink-black);
      padding-bottom: 8px;
    }

    /* Custom File Upload Button inspired by bubble cutouts in designinspo.jpg */
    .bubble-upload-btn {
      display: block;
      background: var(--paper-white);
      border: 2px solid var(--ink-black);
      border-radius: 30px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink-black);
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .bubble-upload-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink-black);
    }
    #image-uploader { display: none; }

    .section-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555;
      margin-bottom: -5px;
    }

    /* Jewelry Storage Box Matrix grid */
    .inventory-vault {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: #f0f0f0;
      border: 2px solid var(--ink-black);
      padding: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    /* HIGH CONTRAST NEWSPAPER PRINT CHARM LINKS */
    .charm-link-block {
      width: 60px;
      height: 60px;
      background: var(--paper-white);
      border: 3px solid var(--ink-black);
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }
    .inventory-vault .charm-link-block:hover {
      transform: scale(1.1) rotate(3deg);
      z-index: 2;
    }

    /* Modular side connectors replicating the flat interlocking look */
    .charm-link-block::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 24px;
      background: var(--paper-white);
      border: 2px solid var(--ink-black);
      right: -7px;
      top: 15px;
      z-index: -1;
    }

    .artwork-envelope {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      image-rendering: pixelated; /* Keeps custom uploads crunchily retro */
    }

    /* Main Interactive Display Room Floor */
    .display-lounge {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-right: 40px;
      position: relative;
    }

    /* Active Horizontal Bracelet Assembly Box mimicking the menu bands on the left of designinspo.jpg */
    .bracelet-assembly-deck {
      width: 100%;
      max-width: 720px;
      background: var(--paper-white);
      border: 4px solid var(--ink-black);
      box-shadow: 12px 12px 0 var(--ink-black);
      padding: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .chain-link-flex-rail {
      display: flex;
      align-items: center;
      gap: 5px; /* Clean crisp spacing gaps */
      overflow-x: auto;
      padding: 10px 0;
      width: 100%;
    }
    .chain-link-flex-rail::-webkit-scrollbar { display: none; }

    .chain-link-flex-rail .charm-link-block {
      width: 75px;  /* Blown up on presentation rail */
      height: 75px;
      flex-shrink: 0;
      animation: popInBlock 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .chain-link-flex-rail .charm-link-block::after {
      width: 8px;
      height: 30px;
      right: -10px;
      top: 18px;
    }
    .chain-link-flex-rail .charm-link-block:last-child::after {
      display: none; /* Hide dangling end link clip */
    }

    @keyframes popInBlock {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* Decorative Vertical Banner text box pulled straight out of the graphic theme */
    .vertical-banner-tag {
      position: absolute;
      right: 25px;
      top: 40px;
      background: var(--paper-white);
      border: 3px solid var(--ink-black);
      padding: 15px 6px;
      font-family: 'Arial Black', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      box-shadow: 4px 4px 0 var(--ink-black);
      z-index: 2;
    }

    .footer-ticker-tag {
      margin-top: 30px;
      background: var(--paper-white);
      border: 2px solid var(--ink-black);
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      transform: rotate(-1deg);
      box-shadow: 3px 3px 0 var(--ink-black);
    }

    .reset-btn {
      background: #ff4757;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: bold;
      padding: 8px;
      border: 2px solid var(--ink-black);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink-black);
      margin-top: auto;
    }
    .reset-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink-black); }
  </style>
</head>
<body>

  <!-- Main Canvas Frame container inner lounge box mapping -->
  <div class="app-canvas">
    
    <!-- Vertical Print Accent Label Tag -->
    <div class="vertical-banner-tag">Special Section</div>

    <!-- Left Controls Panel Block Frame -->
    <div class="control-deck zine-box">
      <h2>Charm Editor</h2>
      
      <div style="display:flex; flex-direction:column; gap:6px;">
        <span class="section-lbl">Collage Generator</span>
        <label for="image-uploader" class="bubble-upload-btn">
          💥 Load Custom PNG/JPG Image
        </label>
        <input type="file" id="image-uploader" accept="image/png, image/jpeg">
      </div>

      <div style="display:flex; flex-direction:column; flex:1; gap:8px; margin-top:5px;">
        <span class="section-lbl">Jewelry Box Stock</span>
        <div class="inventory-vault" id="vault-target">
          <!-- Populated by JavaScript logic matrices -->
        </div>
      </div>

      <button class="reset-btn" id="purge-rail-btn">Clear Bracelet</button>
    </div>

    <!-- Active Presentation Runway Platform Area -->
    <div class="display-lounge">
      
      <!-- Horizontal Linked Bracelet Rail matching the item banners -->
      <div class="bracelet-assembly-deck">
        <div class="chain-link-flex-rail" id="active-rail-track">
          <!-- Active assembled charms hook here -->
        </div>
      </div>

      <!-- Whimsical Interactive Instruction Note -->
      <div class="footer-ticker-tag">
        👉 CLICK VAULT LINK TO SNAP ONTO BRACELET • CLICK RAIL BLOCK TO DISCARD
      </div>

    </div>

  </div>

  <script>
    const vaultTarget = document.getElementById('vault-target');
    const activeRailTrack = document.getElementById('active-rail-track');
    const imageUploader = document.getElementById('image-uploader');
    const purgeRailBtn = document.getElementById('purge-rail-btn');

    // Central App State Database Repository (Featuring quirky aesthetic inline vector glyph shapes)
    let charmVaultMemory = [
      { id: 'zine_cat', type: 'svg', content: `<svg viewBox="0 0 24 24" width="36" height="36" fill="#000"><path d="M12 2c-1.1 0-2 .9-2 2v1.1C8.4 5.6 7 7.6 7 10v4l-2 2v1h14v-1l-2-2v-4c0-2.4-1.4-4.4-3-4.9V4c0-1.1-.9-2-2-2zm0 18c-1.1 0-2-.9-2-2h4c0 1.1-.9 2-2 2z"/></svg>` }, // Bell charm
      { id: 'zine_heart', type: 'svg', content: `<svg viewBox="0 0 24 24" fill="#ff3366" width="34" height="34"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>` },
      { id: 'zine_star', type: 'svg', content: `<svg viewBox="0 0 24 24" fill="#000" width="34" height="34"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>` },
      { id: 'zine_peace', type: 'svg', content: `<svg viewBox="0 0 24 24" stroke="#000" stroke-width="2" fill="none" width="32" height="32"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M12 12l7 7M12 12L5 17"/></svg>` },
      { id: 'zine_eye', type: 'svg', content: `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" width="34" height="34"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3" fill="#fcd116"/></svg>` }, // Eye graphic inspired by the cat collage iris
      { id: 'zine_initial', type: 'text', content: 'A' },
      { id: 'zine_initial2', type: 'text', content: 'H' }
    ];

    let activeBraceletChain = [];

    window.onload = () => {
      generateInventoryVaultGrid();
      // Setup default placeholder configuration strings on initialization
      activeBraceletChain = [charmVaultMemory[4], charmVaultMemory[1], charmVaultMemory[2], charmVaultMemory[5], charmVaultMemory[6]];
      buildActiveBraceletRail();
    };

    // Render Left Hand Selection Vault Frame Grid
    function generateInventoryVaultGrid() {
      vaultTarget.innerHTML = "";
      charmVaultMemory.forEach(charm => {
        const link = document.createElement('div');
        link.classList.add('charm-link-block');

        const env = document.createElement('div');
        env.classList.add('artwork-envelope');

        if (charm.type === 'svg') {
          env.innerHTML = charm.content;
        } else if (charm.type === 'text') {
          env.style.fontFamily = 'Arial Black, sans-serif';
          env.style.fontSize = '1.4rem';
          env.style.color = '#000';
          env.textContent = charm.content;
        } else if (charm.type === 'upload') {
          env.style.backgroundImage = `url('${charm.content}')`;
        }

        link.appendChild(env);
        link.addEventListener('click', () => appendCharmToRailTrack(charm));
        vaultTarget.appendChild(link);
      });
    }

    // Render Center Active Horizontal Linked Bracelet
    function buildActiveBraceletRail() {
      activeRailTrack.innerHTML = "";
      activeBraceletChain.forEach((charm, positionIdx) => {
        const link = document.createElement('div');
        link.classList.add('charm-link-block');

        const env = document.createElement('div');
        env.classList.add('artwork-envelope');

        if (charm.type === 'svg') {
          env.innerHTML = charm.content;
        } else if (charm.type === 'text') {
          env.style.fontFamily = 'Arial Black, sans-serif';
          env.style.fontSize = '1.6rem';
          env.style.color = '#000';
          env.textContent = charm.content;
        } else if (charm.type === 'upload') {
          env.style.backgroundImage = `url('${charm.content}')`;
        }

        link.appendChild(env);
        link.addEventListener('click', () => discardCharmFromRailTrack(positionIdx));
        activeRailTrack.appendChild(link);
      });
    }

    function appendCharmToRailTrack(charmPayload) {
      if (activeBraceletChain.length >= 8) {
        alert("The newsprint display row is full! Click an active piece to slice it out.");
        return;
      }
      activeBraceletChain.push(charmPayload);
      buildActiveBraceletRail();
    }

    function discardCharmFromRailTrack(targetIdx) {
      activeBraceletChain.splice(targetIdx, 1);
      buildActiveBraceletRail();
    }

    // Binary Stream Image processing loop handling standard uploads
    imageUploader.addEventListener('change', function(e) {
      const fileTarget = e.target.files[0];
      if (!fileTarget) return;

      const streamReader = new FileReader();
      streamReader.onload = function(event) {
        const compiledDataUrl = event.target.result;
        
        // Push user asset object up onto global vault directory
        charmVaultMemory.unshift({
          id: `custom_zine_asset_${Date.now()}`,
          type: 'upload',
          content: compiledDataUrl
        });

        // Trigger updates across dynamic window elements
        generateInventoryVaultGrid();
        appendCharmToRailTrack(charmVaultMemory[0]);
      };
      streamReader.readAsDataURL(fileTarget);
    });

    purgeRailBtn.addEventListener('click', () => {
      activeBraceletChain = [];
      buildActiveBraceletRail();
    });
  </script>
</body>
</html>
